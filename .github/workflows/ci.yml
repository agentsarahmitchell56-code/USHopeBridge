name: HOPEBRIDGE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "redesign/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
      - name: Smoke-test key public routes
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hopebridge-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/hopebridge-home.html; then
              break
            fi
            sleep 2
          done

          test -s /tmp/hopebridge-home.html
          grep -q "A steadier path" /tmp/hopebridge-home.html
          for route in /apply /status /chat; do
            echo "Checking $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" -o /dev/null
          done
