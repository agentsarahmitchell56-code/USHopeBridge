name: HOPEBRIDGE CI

on:
  pull_request:
    branches: [main, "redesign/**"]
  push:
    branches: [main, "redesign/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Lint Next.js app
        run: npm run lint
      - name: Build Next.js app
        run: npm run build
      - name: Smoke-test public and staff routes
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hopebridge-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/hopebridge-home.html; then
              break
            fi
            sleep 2
          done

          test -s /tmp/hopebridge-home.html
          grep -qi "<html" /tmp/hopebridge-home.html

          while IFS= read -r route; do
            echo "Checking $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" -o "/tmp/hopebridge-route.html"
            test -s /tmp/hopebridge-route.html
            grep -qi "<html" /tmp/hopebridge-route.html
          done <<'ROUTES'
          /apply
          /status
          /chat
          /admin/login
          /admin
          /community
          ROUTES

      - name: Verify upload API rejects unauthenticated or invalid requests
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hopebridge-upload-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          get_status=$(curl --silent --show-error -o /tmp/hopebridge-upload-get.json -w "%{http_code}" http://127.0.0.1:3000/api/uploads)
          test "$get_status" = "401"
          grep -qi "access denied" /tmp/hopebridge-upload-get.json

          post_status=$(curl --silent --show-error -o /tmp/hopebridge-upload-post.json -w "%{http_code}" -X POST -F "purpose=application" http://127.0.0.1:3000/api/uploads)
          test "$post_status" = "400"
          grep -qi "valid image" /tmp/hopebridge-upload-post.json
